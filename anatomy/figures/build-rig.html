<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Rig — Anthony Rivera</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #09090b; color: #fafafa; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  .iso { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  svg { display: block; max-width: 95vw; max-height: 90vh; }
  .plate { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); width: min(700px, 92vw); background: #09090b; border: 1px solid #27272a; border-radius: 12px; padding: 16px 20px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6); pointer-events: none; }
  .plate-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .fig-n { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; color: #0ea5e9; text-transform: uppercase; }
  .title { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; color: #fafafa; }
  .plate-footer { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; font-size: 11px; color: #a1a1aa; font-family: ui-monospace, monospace; }
  .hint { color: #71717a; }
  .readout { color: #0ea5e9; font-variant-numeric: tabular-nums; }
  .readout .unit { color: #71717a; font-size: 10px; margin-left: 2px; }
  @media (prefers-color-scheme: light) {
    body { background: #fafaf9; color: #0f172a; }
    .plate { background: #ffffff; border-color: #e4e4e7; }
    .title { color: #0f172a; }
    .plate-footer { color: #71717a; }
    .hint { color: #a1a1aa; }
    svg { filter: drop-shadow(0 20px 40px -10px rgba(0,0,0,0.15)); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="iso">
  <svg id="fig" width="700" height="520" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="grad-metal" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1f2937" stop-opacity="1"/>
        <stop offset="50%" stop-color="#374151" stop-opacity="1"/>
        <stop offset="100%" stop-color="#111827" stop-opacity="1"/>
      </linearGradient>
      <linearGradient id="grad-accent" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#22d3ee"/>
        <stop offset="100%" stop-color="#0ea5e9"/>
      </linearGradient>
      <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
        <feOffset dx="2" dy="4" result="offsetblur"/>
        <feComponentTransfer>
          <feFuncA type="linear" slope="0.35"/>
        </feComponentTransfer>
        <feMerge>
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- Isometric projection: azimuth 45°, elevation 30° -->
    <!-- px = (wx - wy) * 0.866 + cx; py = (wx + wy) * 0.5 - wz * 0.866 + cy -->
    <g id="rig" transform="translate(350, 300)">

      <!-- Floor plate / base -->
      <g id="base" filter="url(#shadow)">
        <polygon points="0,-20 120,-20 120,120 0,120" fill="#0f172a" stroke="#27272a" stroke-width="1"/>
        <polygon points="4,-16 116,-16 116,116 4,116" fill="#1e293b"/>
        <!-- Base feet -->
        <rect x="-8" y="-28" width="16" height="12" fill="#111827" rx="1"/>
        <rect x="112" y="-28" width="16" height="12" fill="#111827" rx="1"/>
        <rect x="-8" y="126" width="16" height="12" fill="#111827" rx="1"/>
        <rect x="112" y="126" width="16" height="12" fill="#111827" rx="1"/>
        <!-- Label plate -->
        <rect x="24" y="36" width="72" height="14" fill="#111827" rx="1" stroke="#27272a" stroke-width="0.5"/>
        <rect x="28" y="40" width="8" height="6" fill="#0ea5e9" rx="0.5"/>
        <rect x="40" y="40" width="8" height="6" fill="#0ea5e9" rx="0.5" opacity="0.6"/>
        <rect x="52" y="40" width="8" height="6" fill="#0ea5e9" rx="0.5" opacity="0.3"/>
      </g>

      <!-- Vertical posts -->
      <g id="posts">
        <rect x="-2" y="-80" width="8" height="64" fill="#1f2937" stroke="#374151" stroke-width="0.5"/>
        <rect x="114" y="-80" width="8" height="64" fill="#1f2937" stroke="#374151" stroke-width="0.5"/>
        <rect x="2" y="-76" width="4" height="60" fill="#374151"/>
        <rect x="118" y="-76" width="4" height="60" fill="#374151"/>
      </g>

      <!-- Top rail -->
      <g id="top-rail">
        <polygon points="0,-84 120,-84 120,-76 0,-76" fill="#374151" stroke="#4b5563" stroke-width="0.5"/>
        <rect x="2" y="-82" width="116" height="2" fill="#4b5563"/>
        <!-- Tick ruler -->
        <g id="ruler">
          <rect x="10" y="-83" width="2" height="6" fill="#0ea5e9"/>
          <rect x="30" y="-83" width="2" height="4" fill="#6b7280"/>
          <rect x="50" y="-83" width="2" height="6" fill="#0ea5e9"/>
          <rect x="70" y="-83" width="2" height="4" fill="#6b7280"/>
          <rect x="90" y="-83" width="2" height="6" fill="#0ea5e9"/>
          <rect x="110" y="-83" width="2" height="4" fill="#6b7280"/>
        </g>
      </g>

      <!-- Carriage (moving part) -->
      <g id="carriage" transform="translate(40, -120)">
        <polygon points="0,0 80,0 80,40 0,40" fill="#27272a" stroke="#4b5563" stroke-width="0.5"/>
        <polygon points="4,4 76,4 76,36 4,36" fill="#374151"/>
        <!-- Carriage bushings -->
        <rect x="12" y="8" width="10" height="6" fill="#111827" rx="1"/>
        <rect x="58" y="8" width="10" height="6" fill="#111827" rx="1"/>
        <rect x="12" y="26" width="10" height="6" fill="#111827" rx="1"/>
        <rect x="58" y="26" width="10" height="6" fill="#111827" rx="1"/>
        <!-- Subject: build indicator light -->
        <circle cx="64" cy="20" r="5" fill="#10b981" stroke="#34d399" stroke-width="1"/>
        <circle cx="64" cy="20" r="3" fill="#bbf7d0"/>
        <circle cx="64" cy="20" r="5.5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4"/>
        <animate id="blink" attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
        <!-- Knob -->
        <circle cx="20" cy="30" r="6" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
        <circle cx="20" cy="30" r="2.5" fill="#6b7280"/>
        <path d="M20 24 L20 16" stroke="#6b7280" stroke-width="1"/>
        <path d="M16 24 L14 24" stroke="#6b7280" stroke-width="1"/>
        <!-- Spring -->
        <path d="M30 42 Q32 38 34 42 Q32 46 34 42" fill="none" stroke="#6b7280" stroke-width="1"/>
        <path d="M34 42 Q36 38 38 42 Q36 46 38 42" fill="none" stroke="#6b7280" stroke-width="1"/>
        <!-- Dial gauge -->
        <circle cx="50" cy="44" r="8" fill="#111827" stroke="#4b5563" stroke-width="1"/>
        <circle cx="50" cy="44" r="7" fill="#1f2937"/>
        <circle cx="50" cy="44" r="6.5" fill="none" stroke="#4b5563" stroke-width="0.5"/>
        <!-- Gauge ticks -->
        <g stroke="#6b7280" stroke-width="1">
          <line x1="50" y1="36" x2="50" y2="32"/>
          <line x1="55.6" y1="40.2" x2="57.8" y2="41.4"/>
          <line x1="58.5" y1="45" x2="60.5" y2="45"/>
          <line x1="55.6" y1="49.8" x2="57.8" y2="48.6"/>
          <line x1="50" y1="52" x2="50" y2="56"/>
          <line x1="44.4" y1="49.8" x2="42.2" y2="48.6"/>
          <line x1="41.5" y1="45" x2="39.5" y2="45"/>
          <line x1="44.4" y1="40.2" x2="42.2" y2="41.4"/>
        </g>
        <!-- Gauge needle (animated) -->
        <line id="needle" x1="50" y1="44" x2="50" y2="34" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="40 50 44; -10 50 44; 40 50 44" dur="5s" repeatCount="indefinite"/>
        <circle cx="50" cy="44" r="1.5" fill="#0ea5e9"/>
      </g>

      <!-- Cable running along posts -->
      <path d="M10,-78 L10,-120 Q10,-128 18,-128 L78,-128 Q86,-128 86,-120" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
      <path d="M10,-78 L10,-120 Q10,-128 18,-128 L78,-128 Q86,-128 86,-120" fill="none" stroke="#111827" stroke-width="1" opacity="0.5"/>
      <!-- Cable connector -->
      <rect x="14" y="-130" width="6" height="4" fill="#111827" rx="0.5"/>
      <rect x="80" y="-130" width="6" height="4" fill="#111827" rx="0.5"/>

      <!-- Plunger / subject moving up-down -->
      <g id="plunger" transform="translate(50, -120)">
        <rect x="-6" y="-30" width="12" height="30" fill="#0ea5e9" stroke="#22d3ee" stroke-width="1"/>
        <rect x="-4" y="-28" width="8" height="28" fill="#22d3ee" opacity="0.9"/>
        <rect x="-2" y="-26" width="4" height="24" fill="#bbf7d0" opacity="0.8"/>
        <!-- Plunger cap -->
        <rect x="-8" y="-34" width="16" height="6" fill="#111827" rx="1"/>
        <rect x="-6" y="-32" width="12" height="2" fill="#374151"/>
      </g>

      <!-- Shadows under parts -->
      <ellipse cx="60" cy="100" rx="40" ry="10" fill="black" opacity="0.15"/>
      <ellipse cx="60" cy="100" rx="20" ry="5" fill="black" opacity="0.1"/>

    </g>

    <!-- Motion: carriage slides back and forth -->
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 30,0; 0,0" dur="6s" repeatCount="indefinite" begin="0s"/>
  </svg>

  <div class="plate">
    <div class="plate-header">
      <span class="fig-n">Fig 01 · Build Rig</span>
      <span class="title">Rig de build y despliegue</span>
    </div>
    <div class="plate-footer">
      <span class="hint">Arrastra el cursor · El indicador late en verde cuando el build pasa</span>
      <span class="readout"><span id="readout">0</span><span class="unit"> %</span></span>
    </div>
  </div>

<script>
(function(){
  const svg = document.getElementById('fig');
  const needle = document.getElementById('needle');
  const readout = document.getElementById('readout');
  const rig = document.getElementById('rig');
  let t = 0;

  function iso(wx, wy, wz) {
    const cx = 350, cy = 300;
    const cos30 = Math.cos(Math.PI/6);
    const sin30 = Math.sin(Math.PI/6);
    const cosEl = Math.cos(Math.PI/6); // elevation 30°
    const px = (wx - wy) * cos30 + cx;
    const py = (wx + wy) * sin30 - wz * cosEl + cy;
    return [px, py];
  }

  function ease(t) {
    return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
  }

  function frame() {
    t = (t + 0.008) % 1;
    const e = ease(t);

    // Needle: sweep from 40° to -10° and back
    const angle = 40 + (e * -50);
    needle.setAttribute('transform', `rotate(${angle} 50 44)`);

    // Readout: percentage
    const pct = Math.round(e * 100);
    readout.textContent = pct;

    // Plunger: moves up as build progresses
    const plungerZ = e * 20;
    const plunger = document.getElementById('plunger');
    if (plunger) {
      plunger.setAttribute('transform', `translate(50, -120) translate(0, ${-plungerZ})`);
    }

    requestAnimationFrame(frame);
  }

  // Pointer interaction: hover changes speed
  let speed = 1;
  svg.addEventListener('pointermove', () => { speed = 1.5; });
  svg.addEventListener('pointerleave', () => { speed = 1; });

  // Reduced motion respect
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const anims = svg.querySelectorAll('animate, animateTransform');
    anims.forEach(a => a.remove());
    needle.removeAttribute('animateTransform');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
